[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rulfuse"
version = "0.1.0"
description = "Multimodal remaining-useful-life prediction on the Nonastreda milling dataset."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "Pillow>=10.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
eda = ["matplotlib>=3.8"]
dev = ["ruff>=0.6", "pyright>=1.1.380"]
hub = ["huggingface_hub>=0.24"]
# The frozen encoders (PROJECT_PLAN.md D16). Install torch first, from the right index:
# CPU on the laptop (https://download.pytorch.org/whl/cpu), CUDA 12.6 on Ruche
# (https://download.pytorch.org/whl/cu126; docs/RUCHE_RUNBOOK.md §7).
encoders = [
    "torch>=2.4",
    "transformers>=4.51",
    "mantis-tsfm>=1.1",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
]

# Baseline B6, OmniFuser-RUL (PROJECT_PLAN.md D20): OmniFuser v1.1 and torchvision. Install
# torch first, as for the encoders; torchvision must match it (docs/RUCHE_RUNBOOK.md §12.1).
omnifuser = [
    "torch>=2.4",
    "torchvision>=0.19",
    "omnifuser-reproduction @ git+https://github.com/taanakoum/OmniFuser@v1.1",
]

[project.scripts]
rulfuse = "rulfuse.cli:main"

[tool.setuptools.packages.find]
include = ["rulfuse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: one algorithm or component checked against an independent contract",
    "integration: multiple components, files, model inputs, or external interfaces",
    "e2e: a complete synthetic fit, study, CLI workflow, or report lifecycle",
    "regression: guards a previously discovered or newly reproduced defect",
    "adversarial: poisoning, invalid inputs, corrupted artifacts, or boundary attacks",
    "scientific: statistical recovery or learning behavior on synthetic ground truth",
    "slow: training or other checks unsuitable for the fast feedback loop",
    "gpu: requires a CUDA device; skipped when unavailable",
    "system: subprocess, shell, scheduler, or command-line interface checks",
    "compatibility: retained multi-seed API behavior; not required by current one-seed studies",
    "requirements(*ids): requirements from PROJECT_PLAN.md P1-P22 and decisions D*/O*",
    "data: needs the real Nonastreda data under RULFUSE_DATA_ROOT (skipped when absent)",
    "weights: loads a real pretrained checkpoint from the Hugging Face cache (skipped when absent)",
]

[tool.coverage.run]
branch = true
source = ["rulfuse"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["rulfuse", "scripts", "tests"]
pythonVersion = "3.11"
venvPath = "D:/RULModel"
venv = ".venv"
